<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <link rel = "stylesheet" href="css/style-cadastro.css">

  <!---- TÍTULO DA ABA DO NAVEGADOR ---->
  <title>Laser Brasil 3000 - Cadastro de Produtos</title>

</head>


<body>

<!---- CAIXA PRINCIPAL (CONTAINER) ---->

    <div class="parte-mae">
    
	<!---- PARTE DIREITA ---->

   <main class="conteudo-principal">
            
      <div class="topo">
         <h2>Cadastro de Produtos</h2>
         <p>Adicione um novo item ao estoque</p>
      </div>

<!---- PARTE DE CADASTRO---->
	
	<div class="cadastro">
	  <form>

             <div class="campo-form">
                <label for="produto">Nome do produto*</label>
	        <input type="text" id="produto" placeholder="Digite o nome..." required>
	     </div>

	    <div class="campo-form">
		<label for="categoria">Categoria*</label>
	        <input type="text" id="categoria" placeholder="Ex: Toner..." required>	
   	    </div>

	    <div class="campo-form">
		<label for="modelo">Modelo compatível*</label>
	        <input type="text" id="modelo" placeholder="Ex: Cannon G1000..." required>
            </div>

	    <div class="campo-form">
		<label for="disponivel">Quantidade disponivel*</label>
	        <input type="number" id="disponivel" placeholder="0" required>
            </div>

	    <div class="campo-form">
		<label for="minimo">Estoque mínimo*</label>
	        <input type="number" id="minimo" placeholder="0" required>
            </div>

	    <div class="campo-form">
	       <label for="observacoes">Observações</label>
                <textarea id="observacoes" rows="4" placeholder="Fornecedor preferencial, rendimento, localização na prateleira..."></textarea>
            </div>

	  <div class="botoes-form">
             <a href="produtos.html" class="btn-cancelar">Cancelar</a>
             <button type="submit" class="btn-salvar">Salvar</button>
          </div>

	   </form>

		
         </div>
