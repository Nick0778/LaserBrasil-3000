<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de produto | Laser Brasil</title>
  <link rel="stylesheet" href="cadastro.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
     <img src="logo.laserBrasil.png" 
     alt="Logo Laser Brasil 3000" 
     class="logo">
    </div>

    <p class="sidebar-caption">CONTROLE DE ESTOQUE</p>

    <nav class="navigation" aria-label="Navegação principal">
      <a class="nav-link" href="painel.html">
        <span class="nav-icon">▦</span><span>Painel</span>
      </a>
      <a class="nav-link active" href="produtos.html">
        <span class="nav-icon">⬡</span><span>Produtos</span>
      </a>
      <a class="nav-link" href="entradas-saidas.html">
        <span class="nav-icon">⇄</span><span>Entradas e Saídas</span>
      </a>
      <a class="nav-link" href="mais-utilizados.html">
        <span class="nav-icon">▥</span><span>Mais Utilizados</span>
      </a>
    </nav>

    <div class="account-box">
      <strong>usuario@laser.com</strong>
      <a href="login.html">Sair</a>
    </div>
  </aside>

  <main class="main-content">
    <header class="page-header">
      <h1>Cadastro de produto</h1>
      <p>Adicione um novo item ao estoque</p>
    </header>

    <section class="form-card" aria-labelledby="form-title">
      <h2 id="form-title" class="visually-hidden">Dados do produto</h2>
      <form id="form-cadastro" action="#" method="post">
        <div class="field full-width">
          <label for="nome">Nome do produto <span class="required">*</span></label>
          <input id="nome" name="nome" type="text"
                 placeholder="Ex.: Toner HP 105A Preto" required>
        </div>

        <div class="field-grid">
          <div class="field">
            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria">
              <option value="toner">Toner</option>
              <option value="cartucho">Cartucho</option>
              <option value="papel">Papel</option>
              <option value="peca">Peça</option>
              <option value="suprimento">Suprimento</option>
              <option value="outros">Outros</option>
            </select>
          </div>

          <div class="field">
            <label for="modelo">Modelo de impressora compatível</label>
            <input id="modelo" name="modelo" type="text"
                   placeholder="Ex.: HP Laser 107w">
          </div>

          <div class="field">
            <label for="quantidade">Quantidade inicial <span class="required">*</span></label>
            <input id="quantidade" name="quantidade" type="number"
                   min="0" step="1" placeholder="0" required>
          </div>

          <div class="field">
            <label for="minimo">Estoque mínimo <span class="required">*</span></label>
            <input id="minimo" name="minimo" type="number"
                   min="0" step="1" placeholder="0" required>
          </div>
        </div>

        <div class="field full-width observations">
          <label for="observacoes">Observações</label>
          <textarea id="observacoes" name="observacoes" rows="3"
                    placeholder="Fornecedor preferencial, rendimento, localização na prateleira..."></textarea>
        </div>

        <div class="form-actions">
          <a class="button button-secondary" href="painel.html">Cancelar</a>
          <button class="button button-primary" type="submit">Salvar</button>
        </div>
      </form>
    </section>
  </main>

  <button class="help-button" type="button" aria-label="Ajuda">?</button>

  <script>
    document.getElementById('form-cadastro').addEventListener('submit', function(event) {
      event.preventDefault(); 

      const nomeProduto = document.getElementById('nome').value.trim();

      sessionStorage.setItem('produtoCadastrado', nomeProduto);

      window.location.href = 'painel.html';
    });
  </script>
</body>
</html>
