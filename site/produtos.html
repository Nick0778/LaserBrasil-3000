<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <link rel = "stylesheet" href="style-produtos.css">

  <!---- TÍTULO DA ABA DO NAVEGADOR ---->
  <title>Laser Brasil 3000 - Produtos</title>

</head>


<body>

<!---- CAIXA PRINCIPAL (CONTAINER) ---->

    <div class="parte-mae">
    
	<!---- PARTE DIREITA ---->

   <main class="conteudo-principal">
            
      <div class="topo">
	<div>
         <h2>Produtos</h2>
         <p>Itens cadastrados no estoque</p>
	</div>

	<a href="cadastro.html" class="btn-novo-produto">+ Novo Produto</a>
      </div>
    

	<!---- PARTE DE BUSCA ---->
	
	<div class="busca">
	  <form>
             <div class="campo-form">
             <label for="produto">Buscar</label>
             <input type="text" id="email" placeholder="Digite o nome do produto...">
          </div>
	  </form>    			     
	
	 <!---- FILTRO DE PESQUISA ---->

	 <div class="filtros">
	    <button class= "ativo">Todos</button>
    	    <button>Baixo</button>
    	    <button>Esgotado</button>
    	    <button>OK</button>
	</div>  

	<!---- LISTA DE PRODUTOS---->

	  <div>
	    <table class="tabela-produtos">
	     <thead>
                <tr>
                  <th>PRODUTO</th>
                  <th>CATEGORIA</th>
                  <th>QUANTIDADE</th>
                  <th>ESTOQUE MÍNIMO</th>
                  <th>STATUS</th>
                </tr>
              </thead>
	      
              <tbody>
		<tr>
                  <td>Toner HP 105A</td>
                  <td>Toner</td>
                  <td>24</td>
                  <td>8</td>
                  <td><span class="status-ok">OK</span></td>
                </tr>

                <tr>
                  <td>Toner Brother TN-1060</td>
                  <td>Toner</td>
                  <td>0</td>
                  <td>6</td>
                  <td><span class="status-esgotado">Esgotado</span></td>
               </tr>

	       <tr>
                  <td>Cartucho Epson 544 Ciano</td>
                  <td>Cartucho</td>
                  <td>3</td>
                  <td>6</td>
                  <td><span class="status-estoque-baixo">Estoque baixo</span></td>
               </tr>
              </thead>
            </tbody>
	 </div>
      </main>
   </body>
</html>
