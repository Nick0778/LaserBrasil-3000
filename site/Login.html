<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Laser Brasil 3000 - Controle de Estoque</title>
        <link rel="stylesheet" href="css/Login.css">
        <link rel="icon" type="image/png" href="images/lb-logo.png">
    </head>
    <body>
        <div class="login-container">
            <!--COLOCAR A LOGO GRAMNDE AQUI-->
            <div class="logo-container">
                <img src="images/logo-laserBrasil2.png" alt="Logo Laser Brasil 3000" class="logo-img">
            </div>
            <div class="login-header">
                <h2>Controle de Estoque</h2>
                <p>Acesse com suas credenciais</p>
            </div>

            <form action="barra-lateral.html">
                <div class="form-group">
                    <labeL for="user">Usuário *</labeL>
                    <input type="text" id="user" name="user" placeholder="user123" required>
                </div>

                <div class="form-group">
                    <labeL for="password">Senha *</labeL>
                    <input type="password" id="password" name="password" placeholder="********" required>
                </div>

                <button type="submit" class="btn-submit">Entrar</button>
            </form>

            <div class="admin-access">
                <div class="divider">
                    <span>ACESSO RÁPIDO</span>
                </div>
                <a href="barra-lateral.html" class="btn-admin">ADMIN</a>
            </div>
        </div>
    </body>
</html>
